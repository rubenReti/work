spring.application.name=elm-leave-service

# Server Port (set to dynamic for Eureka just like employee-service)
server.port=0

# SQL Server DB
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LeaveDB;encrypt=false;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Logging File Output
logging.file.name=C:/Work/Java/elm-leave-service/elm-leave-serviceLOG.log

# Logging Levels
logging.level.root=INFO
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=DEBUG
logging.level.com.example=DEBUG
logging.level.com.netflix.eureka=DEBUG
logging.level.com.netflix.discovery=DEBUG

# Force logs to flush immediately
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5

# Management / Actuator
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.mappings.enabled=true

# Spring Boot Override Handling
spring.main.allow-bean-definition-overriding=true

# Disable Mongo (if not needed)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# JWT Key Validation
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/auth/.well-known/jwks.json
