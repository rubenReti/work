spring.application.name=elm-api-gateway
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Ensure API Gateway waits before trying to register
eureka.client.initial-instance-info-replication-interval-seconds=30
eureka.client.registry-fetch-interval-seconds=10

# API Gateway Service Registration
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.zone=default
eureka.instance.leaseRenewalIntervalInSeconds=10
eureka.instance.leaseExpirationDurationInSeconds=30
eureka.instance.statusPageUrl=http://localhost:${server.port}/actuator/info
eureka.instance.healthCheckUrl=http://localhost:${server.port}/actuator/health

# Enable Eureka-based Dynamic Routing
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Manually define route for Employee Service
spring.cloud.gateway.routes[0].id=employee-service
spring.cloud.gateway.routes[0].uri=lb://ELM-EMPLOYEE-SERVICE
spring.cloud.gateway.routes[0].predicates=Path=/employees/**
#spring.cloud.gateway.routes[0].filters=RemoveRequestHeader=Cookie, PreserveHostHeader
spring.cloud.gateway.routes[0].filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.routes[0].filters[1]=PreserveHostHeader
spring.cloud.gateway.routes[0].filters[2]=CircuitBreaker=name=employeeCircuitBreaker,fallbackUri=forward:/fallback/employees



# Manually define route for Auth Service
spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=lb://ELM-AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates=Path=/auth/**
#spring.cloud.gateway.routes[1].filters=RemoveRequestHeader=Cookie, PreserveHostHeader
spring.cloud.gateway.routes[1].filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.routes[1].filters[1]=PreserveHostHeader
spring.cloud.gateway.routes[1].filters[2]=CircuitBreaker=name=authCircuitBreaker,fallbackUri=forward:/fallback/auth


# Logging Configuration
logging.file.name=logs/api-gateway.log
logging.level.root=INFO
logging.level.com.netflix.discovery=TRACE
logging.level.org.springframework.cloud=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

spring.main.web-application-type=reactive

management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/auth/.well-known/jwks.json


