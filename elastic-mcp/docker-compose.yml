version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200" 
    networks:
      - elasticnet

  mcp-java:
    build:
      context: ./mcp-java
    container_name: mcp-java
    ports:
      - "8080:8080"
    depends_on:
      - elasticsearch
    networks:
      - elasticnet
    environment:
      - ELASTICSEARCH_HOST=elasticsearch

  mcp-node:
    build:
      context: ./mcp-node
    container_name: mcp-node
    ports:
      - "3000:3000"
    depends_on:
      - elasticsearch
    networks:
      - elasticnet
    environment:
      - ELASTICSEARCH_NODE=http://elasticsearch:9200

networks:
  elasticnet:
